<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CMC Strategy Forge — PnL Replay</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Inter, sans-serif; background: #0b1020; color: #e8ecf5; padding: 24px; }
    .card { background: #151d33; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .metric h4 { margin: 0; font-size: 12px; opacity: 0.8; }
    .metric p { margin: 4px 0 0; font-size: 20px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #2a3555; padding: 8px; text-align: left; }
    .badge { background: #2563eb; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>CMC Strategy Verification Replay</h1>
  <p>CoinMarketCap Track 2 — simulation only, no live trading.</p>
  <div class="card metrics">
    <div class="metric"><h4>Total Return</h4><p>0%</p></div>
    <div class="metric"><h4>Sharpe</h4><p>0</p></div>
    <div class="metric"><h4>Max Drawdown</h4><p>0%</p></div>
    <div class="metric"><h4>Win Rate</h4><p>0%</p></div>
    <div class="metric"><h4>Trades</h4><p>0</p></div>
  </div>
  <div class="card"><canvas id="chart"></canvas></div>
  <div class="card">
    <h2>Decision log</h2>
    <table>
      <thead><tr><th>Time</th><th>Action</th><th>Price</th><th>Signal</th><th>Confidence</th><th>Equity</th></tr></thead>
      <tbody>
        
      </tbody>
    </table>
  </div>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Equity', data: [], borderColor: '#60a5fa', tension: 0.2 },
          { label: 'Price', data: [], borderColor: '#34d399', tension: 0.2 }
        ]
      },
      options: { responsive: true, plugins: { legend: { labels: { color: '#e8ecf5' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
    });
  </script>
</body>
</html>
